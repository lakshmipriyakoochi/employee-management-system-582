  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

      theme: {

  </script>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, createContext, useContext } = React;

    // --- INITIAL DATA & STORAGE ---
    const INITIAL_EMPLOYEES = [

      {

      {

      {

        department: "Finance",
        role: "Senior Financial Analyst",
        salary: 98000,
        status: "On Leave",
        joiningDate: "2021-02-14",
        phone: "+1 (555) 654-3210",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "EMP-1007",
        name: "Chloe Dubois",
        email: "chloe.dubois@company.com",
        department: "Design",
        role: "UX Researcher & Specialist",
        salary: 92000,
        status: "Active",
        joiningDate: "2023-06-01",
        phone: "+1 (555) 789-0123",
        avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "EMP-1008",
        name: "Jameson Miller",
        email: "jameson.m@company.com",
        department: "Sales",
        role: "Enterprise Account Executive",
        salary: 125000,
        status: "Active",
        joiningDate: "2022-09-18",
        phone: "+1 (555) 210-9876",
        avatar: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80"
      }
    ];

    const DEPARTMENTS = [
      "Engineering", "Design", "Marketing", "Human Resources", "Finance", "Sales", "Operations"
    ];

    const AVATAR_PRESETS = [
      "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80"
    ];

    // Formatters
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD', maximumFractionDigits: 0
      }).format(amount || 0);
    };

    const formatDate = (dateString) => {
      if (!dateString) return 'N/A';
      try {
        return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) { return dateString; }
    };

    // --- CONTEXT DEFINITIONS ---
    const AuthContext = createContext();
    const EmployeeContext = createContext();

    const AuthProvider = ({ children }) => {
      const [user, setUser] = useState(() => {
        try {
          const data = localStorage.getItem('emp_system_auth_v1');
          return data ? JSON.parse(data) : null;
        } catch (e) { return null; }
      });

      const login = (email, password) => {
        const formattedName = email.split('@')[0].replace(/[\._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const userData = {
          name: formattedName || 'System Admin',
          email: email,
          role: email.toLowerCase().includes('admin') ? 'System Administrator' : 'HR Manager',
          avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&auto=format&fit=crop&q=80'
        };
        setUser(userData);
        localStorage.setItem('emp_system_auth_v1', JSON.stringify(userData));
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('emp_system_auth_v1');
      };

      return (
        <AuthContext.Provider value={{ user, login, logout, isAuthenticated: !!user }}>
          {children}
        </AuthContext.Provider>
      );
    };

    const EmployeeProvider = ({ children }) => {
      const [employees, setEmployees] = useState(() => {
        try {
          const data = localStorage.getItem('emp_system_employees_v1');
          if (!data) {
            localStorage.setItem('emp_system_employees_v1', JSON.stringify(INITIAL_EMPLOYEES));
            return INITIAL_EMPLOYEES;
          }
          return JSON.parse(data);
        } catch (e) { return INITIAL_EMPLOYEES; }
      });

      const [toast, setToast] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('emp_system_employees_v1', JSON.stringify(employees));
        } catch (e) { console.error(e); }
      }, [employees]);

      const showToast = (message, type = 'success') => setToast({ id: Date.now(), message, type });
      const clearToast = () => setToast(null);

      const addEmployee = (newEmpData) => {
        const newEmp = {
          ...newEmpData,
          id: newEmpData.id || `EMP-${Math.floor(1000 + Math.random() * 9000)}`,
          salary: Number(newEmpData.salary) || 0,
          avatar: newEmpData.avatar || AVATAR_PRESETS[0],
          status: newEmpData.status || 'Active',
          joiningDate: newEmpData.joiningDate || new Date().toISOString().split('T')[0]
        };
        setEmployees(prev => [newEmp, ...prev]);
        showToast(`Employee ${newEmp.name} added successfully!`, 'success');
      };

      const updateEmployee = (id, updatedData) => {
        setEmployees(prev =>
          prev.map(emp => emp.id === id ? { ...emp, ...updatedData, salary: Number(updatedData.salary) || emp.salary } : emp)
        );
        showToast('Employee updated successfully!', 'info');
      };

      const deleteEmployee = (id) => {
        const empToDelete = employees.find(e => e.id === id);
        setEmployees(prev => prev.filter(emp => emp.id !== id));
        showToast(`Employee ${empToDelete ? empToDelete.name : id} deleted.`, 'warning');
      };

      const resetToDefaultData = () => {
        setEmployees(INITIAL_EMPLOYEES);
        showToast('Reset data to default sample employees.', 'info');
      };

      return (
        <EmployeeContext.Provider value={{
          employees, addEmployee, updateEmployee, deleteEmployee, resetToDefaultData, toast, showToast, clearToast
        }}>
          {children}
        </EmployeeContext.Provider>
      );
    };

    // --- COMPONENTS ---
    const Toast = () => {
      const { toast, clearToast } = useContext(EmployeeContext);
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => clearToast(), 4000);
        return () => clearTimeout(timer);
      }, [toast]);

      if (!toast) return null;
      const borders = {
        success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
        info: 'border-blue-500/30 bg-blue-950/80 text-blue-100',
        warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100'
      };
      return (
        <div className="fixed bottom-5 right-5 z-50 animate-bounce">
          <div className={`flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl ${borders[toast.type] || borders.info}`}>
            <span className="text-sm font-medium pr-2">✨ {toast.message}</span>
            <button onClick={clearToast} className="p-1 hover:bg-white/10 rounded-lg text-slate-400 hover:text-white">✕</button>
          </div>
        </div>
      );
    };

    const Navbar = ({ onOpenAddModal }) => {
      const { user, logout } = useContext(AuthContext);
      return (
        <header className="sticky top-0 z-30 h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-4 lg:px-8 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-[1px] shadow-lg shadow-blue-500/20">
              <div className="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center font-black text-blue-400">👔</div>
            </div>
            <div>
              <h1 className="font-bold text-lg text-white tracking-tight leading-none">NEXUS<span className="text-blue-500 font-extrabold">EMS</span></h1>
              <p className="text-[11px] text-slate-400 font-medium">Enterprise Staff Portal</p>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <button
              onClick={onOpenAddModal}
              className="hidden sm:flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs shadow-md shadow-blue-600/20 transition-all hover:scale-[1.02]"
            >
              + Add Staff
            </button>
            <div className="flex items-center gap-3 pl-3 border-l border-slate-800">
              <img src={user?.avatar} alt={user?.name} className="w-8 h-8 rounded-full object-cover ring-2 ring-blue-500/30" />
              <div className="hidden md:block text-left">
                <div className="text-xs font-semibold text-slate-200">{user?.name}</div>
                <div className="text-[10px] text-blue-400 font-medium">{user?.role}</div>
              </div>
              <button onClick={logout} title="Log out" className="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg">🚪</button>
            </div>
          </div>
        </header>
      );
    };

    const Sidebar = ({ activeTab, setActiveTab, onOpenAddModal }) => {
      const { resetToDefaultData, employees } = useContext(EmployeeContext);
      return (
        <aside className="w-64 bg-slate-900/60 border-r border-slate-800/80 flex-shrink-0 flex flex-col justify-between py-6 px-4 hidden md:flex">
          <div className="space-y-6">
            <div>
              <div className="px-3 mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Navigation</div>
              <nav className="space-y-1">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all ${
                    activeTab === 'dashboard' ? 'bg-blue-600/15 text-blue-400 border border-blue-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <span>📊 Dashboard</span>
                </button>
                <button
                  onClick={() => setActiveTab('employees')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all ${
                    activeTab === 'employees' ? 'bg-blue-600/15 text-blue-400 border border-blue-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <span>👥 All Employees</span>
                  <span className="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-slate-800 text-slate-300">{employees.length}</span>
                </button>
              </nav>
            </div>

            <div>
              <div className="px-3 mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Quick Actions</div>
              <div className="space-y-1.5">
                <button
                  onClick={onOpenAddModal}
                  className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 bg-slate-800/40 hover:bg-slate-800 border border-slate-700/50 hover:border-blue-500/40 transition-all"
                >
                  ➕ Add New Employee
                </button>
                <button
                  onClick={resetToDefaultData}
                  className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-amber-300 bg-slate-800/20 hover:bg-amber-950/30 border border-slate-800 transition-all"
                >
                  🔄 Reset Demo Data
                </button>
              </div>
            </div>
          </div>

          <div className="p-3.5 rounded-xl bg-slate-950/60 border border-slate-800/80">
            <div className="flex items-center gap-2 mb-1 text-xs font-semibold text-emerald-400">
              ⚡ LocalStorage Active
            </div>
            <p className="text-[11px] text-slate-400 leading-tight">Data persists dynamically across refreshes.</p>
          </div>
        </aside>
      );
    };

    // --- MODALS ---
    const EmployeeModal = ({ isOpen, onClose, onSubmit, initialData }) => {
      const isEditing = !!initialData;
      const [formData, setFormData] = useState({
        id: '', name: '', email: '', department: 'Engineering', role: '', salary: '', status: 'Active',
        joiningDate: new Date().toISOString().split('T')[0], phone: '', avatar: AVATAR_PRESETS[0]
      });
      const [errors, setErrors] = useState({});

      useEffect(() => {
        if (initialData) {
          setFormData({ ...initialData });
        } else {
          setFormData({
            id: `EMP-${Math.floor(1000 + Math.random() * 9000)}`,
            name: '', email: '', department: 'Engineering', role: '', salary: '', status: 'Active',
            joiningDate: new Date().toISOString().split('T')[0], phone: '', avatar: AVATAR_PRESETS[Math.floor(Math.random()*AVATAR_PRESETS.length)]
          });
        }
        setErrors({});
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!formData.name.trim()) errs.name = 'Name is required';
        if (!formData.email.trim()) errs.email = 'Email is required';
        if (!formData.role.trim()) errs.role = 'Role is required';
        if (!formData.salary || Number(formData.salary) < 0) errs.salary = 'Valid salary required';
        if (Object.keys(errs).length > 0) { setErrors(errs); return; }
        onSubmit(formData);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/50">
              <h3 className="text-lg font-bold text-white">{isEditing ? '✏️ Edit Employee Details' : '👤 Add New Employee'}</h3>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-400 mb-2 uppercase">Select Avatar</label>
                <div className="flex items-center gap-2 overflow-x-auto pb-2">
                  {AVATAR_PRESETS.map((url, idx) => (
                    <button
                      key={idx} type="button" onClick={() => setFormData({ ...formData, avatar: url })}
                      className={`w-11 h-11 rounded-full overflow-hidden border-2 flex-shrink-0 ${formData.avatar === url ? 'border-blue-500 scale-110 ring-4 ring-blue-500/20' : 'border-slate-700 opacity-60'}`}
                    >
                      <img src={url} className="w-full h-full object-cover" />
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Employee ID</label>
                  <input type="text" value={formData.id} disabled className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 font-mono text-sm opacity-70" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Status</label>
                  <select value={formData.status} onChange={e => setFormData({ ...formData, status: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm">
                    <option value="Active">Active</option>
                    <option value="On Leave">On Leave</option>
                    <option value="Terminated">Terminated</option>
                  </select>
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Full Name *</label>
                  <input type="text" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm" placeholder="e.g. Eleanor Vance" />
                  {errors.name && <p className="text-xs text-rose-400 mt-1">{errors.name}</p>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Email Address *</label>
                  <input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm" placeholder="eleanor@company.com" />
                  {errors.email && <p className="text-xs text-rose-400 mt-1">{errors.email}</p>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Phone</label>
                  <input type="text" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm" placeholder="+1 (555) 000-0000" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Department *</label>
                  <select value={formData.department} onChange={e => setFormData({ ...formData, department: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm">
                    {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Role / Position *</label>
                  <input type="text" value={formData.role} onChange={e => setFormData({ ...formData, role: e.target.value })} className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm" placeholder="Lead Architect" />
                  {errors.role && <p className="text-xs text-rose-400 mt-1">{errors.role}</p>}
                </div>
                <div>

              onOpenAddModal={() => { setEditingEmployee(null); setIsFormModalOpen(true); }}
            />
            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
              {activeTab === 'dashboard' ? (
                <DashboardPage
                  setActiveTab={setActiveTab}
                  onOpenAddModal={() => { setEditingEmployee(null); setIsFormModalOpen(true); }}
                  onViewEmployee={(emp) => { setViewingEmployee(emp); setIsDetailModalOpen(true); }}
                />
              ) : (
                <EmployeeListPage
                  onOpenAddModal={() => { setEditingEmployee(null); setIsFormModalOpen(true); }}
                  onViewEmployee={(emp) => { setViewingEmployee(emp); setIsDetailModalOpen(true); }}
                  onEditEmployee={(emp) => { setEditingEmployee(emp); setIsFormModalOpen(true); }}
                  onDeleteEmployee={(emp) => { setDeletingEmployee(emp); setIsDeleteModalOpen(true); }}
                />
              )}
            </main>
          </div>

          <EmployeeModal
            isOpen={isFormModalOpen}
            onClose={() => setIsFormModalOpen(false)}
            onSubmit={(data) => {
              if (editingEmployee) updateEmployee(editingEmployee.id, data);
              else addEmployee(data);
            }}
            initialData={editingEmployee}
          />

          <EmployeeDetailModal
            isOpen={isDetailModalOpen}
            onClose={() => setIsDetailModalOpen(false)}
            employee={viewingEmployee}
            onEdit={(emp) => { setEditingEmployee(emp); setIsFormModalOpen(true); }}
          />

          <DeleteConfirmModal
            isOpen={isDeleteModalOpen}
            onClose={() => setIsDeleteModalOpen(false)}
            onConfirm={deleteEmployee}
            employee={deletingEmployee}
          />

          <Toast />
        </div>
      );
    };

    const App = () => (
      <AuthProvider>
        <EmployeeProvider>
          <MainLayout />
        </EmployeeProvider>
      </AuthProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
